<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PinkScroll - Dynamic TikTok UI</title>
    
    <!-- iOS PWA ve Tam Ekran Ayarları -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0010">

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Üst Bar -->
    <div class="app-header">
        <span class="tab active">Sana Özel</span>
        <span class="tab">Takip Edilenler</span>
    </div>

    <!-- Swiper Kapsayıcı (Videolar JS ile buraya yüklenecek) -->
    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="video-wrapper">
            <!-- Dinamik İletiler JS ile eklenecek -->
        </div>
    </div>

    <!-- Swiper JS & Uygulama Scripti -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
